<style>
/* Layout: sticky top bar, one content column, permit rendered as a perforated pass, verdicts as checklists. Dark-first, matching the project's navy and cyan screens. */
:root{
  --bg:#070d1a; --surface:#0e1729; --surface2:#142039; --line:#24344f;
  --fg:#e6edf8; --muted:#8fa0bd; --accent:#22c1e0; --accent-ink:#04222b;
  --ok:#34d399; --warn:#fbbf24; --bad:#f87171;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f9; --surface:#ffffff; --surface2:#e5edf7; --line:#cbd8ea;
    --fg:#0c1a30; --muted:#51627d; --accent:#0572a0; --accent-ink:#ffffff;
    --ok:#0a7a52; --warn:#8a5600; --bad:#b32222; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f9; --surface:#ffffff; --surface2:#e5edf7; --line:#cbd8ea;
  --fg:#0c1a30; --muted:#51627d; --accent:#0572a0; --accent-ink:#ffffff;
  --ok:#0a7a52; --warn:#8a5600; --bad:#b32222; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);padding-inline:0}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,6vw,4rem)}
h2{font-size:clamp(1.8rem,3.4vw,2.4rem)}
h3{font-size:1.35rem;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono)}
.eyebrow{font:600 .75rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:9px;color:var(--fg);text-decoration:none;font:700 1.35rem/1 var(--display);letter-spacing:.03em;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--accent)}
.navs{display:flex;gap:2px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.navs::-webkit-scrollbar{display:none}
.navs a{color:var(--muted);text-decoration:none;padding:7px 11px;border-radius:6px;font-weight:500;white-space:nowrap}
.navs a:hover{color:var(--fg)}
.navs a.on{color:var(--fg);background:var(--surface2)}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{color:var(--fg)}

main{max-width:1100px;margin:auto;padding:28px 16px 56px;min-height:70vh}
.page-head{display:grid;gap:8px;margin-bottom:22px}
.page-head p{color:var(--muted);max-width:60ch}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.card h3{margin-bottom:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.stack{display:grid;gap:16px}

/* buttons */
.btn{font:600 .95rem var(--body);border-radius:7px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* forms */
.form{display:grid;gap:22px}
.fs{display:grid;gap:14px;border:0;margin:0;padding:0;min-width:0}
.fs legend{font:600 1.35rem var(--display);padding:0;margin-bottom:2px}
.fs .sub{color:var(--muted);font-size:.88rem;margin-top:-10px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:500;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px;width:100%;min-width:0}
input::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input.bad,select.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:.8rem;min-height:0}
.hint{font-size:.78rem;color:var(--muted)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font:600 .72rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.mute{color:var(--muted)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:14px 30px}
.hero-copy{display:grid;gap:18px;justify-items:start}
.hero-copy p.lead{font-size:1.1rem;color:var(--muted);max-width:46ch}
.section{display:grid;gap:18px;padding-block:34px;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:0;counter-reset:s}
.step{padding:6px 18px 6px 0;display:grid;gap:6px;align-content:start;counter-increment:s}
.step::before{content:"Step " counter(s);font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.step h3{font-size:1.3rem}
.step p{color:var(--muted);font-size:.9rem}
.checks4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.chk{display:grid;gap:6px;padding-top:12px;border-top:2px solid var(--accent)}
.chk p{color:var(--muted);font-size:.9rem}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.scope ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;color:var(--muted)}
.scope li::marker{color:var(--accent)}

/* permit pass */
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 250px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;right:239px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{top:-11px} .ticket::after{bottom:-11px}
.t-main{padding:22px 24px;display:grid;gap:18px;min-width:0}
.t-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.t-label{font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.t-id{font:600 clamp(1.5rem,4vw,2.1rem)/1.1 var(--mono);color:var(--accent);letter-spacing:.02em;word-break:break-all}
.t-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:18px}
.kv{display:grid;gap:11px;align-content:start}
.kv h3{font-size:1.1rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.kv dl{margin:0;display:grid;gap:9px}
.kv dt{font:500 .66rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--mono);font-size:.92rem}
.stub{border-left:2px dashed var(--line);padding:22px;display:grid;gap:10px;justify-items:center;align-content:center;background:var(--surface2);text-align:center}
.qrbox{background:#fff;padding:8px;border-radius:8px;line-height:0}
.qrbox img,.qrbox canvas{width:190px;height:190px;max-width:100%;display:block}
.stub small{color:var(--muted);font-size:.78rem}
.stamp{font:700 1.15rem var(--display);letter-spacing:.12em;text-transform:uppercase;border:2px solid currentColor;border-radius:5px;padding:3px 10px;transform:rotate(-4deg);display:inline-block}
.stamp.active{color:var(--ok)} .stamp.expired{color:var(--bad)} .stamp.upcoming{color:var(--warn)}
.hero .ticket{grid-template-columns:minmax(0,1fr) 170px}
.hero .ticket::before,.hero .ticket::after{right:159px}
.hero .qrbox img,.hero .qrbox canvas{width:130px;height:130px}
.hero .t-cols{grid-template-columns:1fr 1fr}
.hero .t-main{padding:18px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono{font-family:var(--mono);font-size:.82rem;white-space:nowrap}
.empty{padding:22px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:8px}

/* stats */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:4px}
.stat .n{font:700 2.6rem/1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat.ok .n{color:var(--ok)} .stat.acc .n{color:var(--accent)} .stat.bad .n{color:var(--bad)}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) 1fr 28px;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:12px 16px;color:var(--muted)}

/* officer */
.status3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.status3 .stat .n{font-size:1.5rem}
.reader{margin-top:12px;border-radius:8px;overflow:hidden;background:var(--bg)}
.reader:empty{display:none}
.verdict{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.v-head{padding:18px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.v-head .word{font:700 clamp(2rem,5vw,3rem)/1 var(--display);letter-spacing:.06em}
.verdict.ok .v-head{background:color-mix(in srgb,var(--ok) 14%,var(--surface))} .verdict.ok .word{color:var(--ok)}
.verdict.bad .v-head{background:color-mix(in srgb,var(--bad) 14%,var(--surface))} .verdict.bad .word{color:var(--bad)}
.v-body{padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.clist li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.clist .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--mono);border:1.5px solid currentColor}
.clist .pass{color:var(--ok)} .clist .fail{color:var(--bad)} .clist .skip{color:var(--muted)}
.clist b{display:block;font-weight:600;color:var(--fg)}
.clist span.d{color:var(--muted);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
.check input{width:auto}

/* about */
.layers{display:grid;gap:0}
.layer{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 16px;border:1px solid var(--line);margin-top:-1px;background:var(--surface)}
.layer:first-child{border-radius:10px 10px 0 0} .layer:last-child{border-radius:0 0 10px 10px}
.layer b{font:700 1.15rem var(--display);color:var(--accent);letter-spacing:.03em}
.layer span{color:var(--muted);font-size:.9rem}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.phase{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:6px;align-content:start}
.phase .eyebrow{font-size:.68rem}
.phase p{color:var(--muted);font-size:.88rem}
footer{border-top:1px solid var(--line);padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:.85rem}
footer div{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:space-between}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:26px}
  .ticket{grid-template-columns:1fr}
  .ticket::before,.ticket::after{display:none}
  .stub{border-left:0;border-top:2px dashed var(--line)}
  .hero .ticket{grid-template-columns:1fr}
  .layer{grid-template-columns:1fr;gap:2px}
}
@media (max-width:520px){
  .top-in{gap:10px}
  .brand span{display:none}
  .bar{grid-template-columns:90px 1fr 24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const iso=d=>d.toLocaleDateString('en-CA');
const today=()=>iso(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=s=>{if(!s)return'–';const[y,m,d]=s.split('-');return `${d} ${MON[+m-1]} ${y}`};
const fmtTime=ts=>new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const maskId=s=>s.length>4?'•'.repeat(s.length-4)+s.slice(-4):s;

const DESTINATIONS=['Kodaikanal','Ooty (Udhagamandalam)','Coonoor','Yercaud','Valparai','Kolli Hills','Yelagiri','Kanyakumari','Rameswaram'];
const PURPOSES=['Tourism','Business','Medical','Education','Family visit','Pilgrimage','Goods transport','Other'];
const CHECKPOINTS=['Ooty Checkpoint','Kodaikanal Checkpoint','Yercaud Checkpoint','Valparai Checkpoint','Kanyakumari Checkpoint','Walayar Checkpoint','Hosur Checkpoint'];

/* ---------- storage (browser local storage, in-memory fallback) ---------- */
const mem={};
const S={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return k in mem?mem[k]:null},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}},
  keys(p){const s=new Set(Object.keys(mem).filter(k=>k.startsWith(p)));try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))s.add(k)}}catch(e){}return[...s]}
};
const J=(k,d)=>{try{const v=S.get(k);return v?JSON.parse(v):d}catch(e){return d}};
const DB={
  permits(){return S.keys('tg:permit:').map(k=>J(k,null)).filter(Boolean).sort((a,b)=>b.createdAt-a.createdAt)},
  permit(id){return J('tg:permit:'+id,null)},
  savePermit(p){S.set('tg:permit:'+p.id,JSON.stringify(p))},
  entries(){return J('tg:entries',[])},
  flags(){return J('tg:flags',[])},
  addEntry(e){const a=DB.entries();a.unshift(e);S.set('tg:entries',JSON.stringify(a))},
  addFlag(f){const a=DB.flags();a.unshift(f);S.set('tg:flags',JSON.stringify(a))},
  clear(onlySample){
    if(onlySample){
      S.keys('tg:permit:').forEach(k=>{const p=J(k,null);if(p&&p.sample)S.del(k)});
      S.set('tg:entries',JSON.stringify(DB.entries().filter(x=>!x.sample)));
      S.set('tg:flags',JSON.stringify(DB.flags().filter(x=>!x.sample)));
    }else{
      S.keys('tg:permit:').forEach(k=>S.del(k));S.set('tg:entries','[]');S.set('tg:flags','[]');
    }
  },
  hasSample(){return DB.permits().some(p=>p.sample)}
};
function newId(){
  const y=new Date().getFullYear();let id;
  do{id=`TN-${y}-${Math.floor(10000+Math.random()*90000)}`}while(DB.permit(id));
  return id;
}
const statusOf=p=>{const t=today();return t<p.from?'upcoming':t>p.to?'expired':'active'};
const qrPayload=(p,over)=>JSON.stringify({id:p.id,name:p.name,dest:(over&&over.dest)||p.dest});

/* sample records, loaded once so the dashboard has something to show */
function seed(){
  if(S.get('tg:seeded'))return;
  S.set('tg:seeded','1');
  if(DB.permits().length)return;
  const now=Date.now(),H=36e5;

/* ---------- verification logic ---------- */
function verify(raw,method,checkpoint){
  let payload=null,id=String(raw||'').trim();
  try{const o=JSON.parse(id);if(o&&typeof o==='object'&&o.id){payload=o;id=String(o.id)}}catch(e){}
  id=id.toUpperCase().replace(/\s+/g,'');
  const viaQR=method==='QR';
  const res={id,method:payload?'QR':'Manual ID',checkpoint,checks:[],permit:null,ok:false,reason:'',qr:'Not used'};
  if(viaQR&&!payload){
    res.reason='QR code format not recognised';res.id=String(raw).slice(0,40);
    res.checks=[
      {label:'Permit on record',state:'fail',detail:'This QR does not carry a TN-TravelGuard permit.'},
      {label:'QR details match',state:'skip',detail:'Not checked.'},
      {label:'Within validity dates',state:'skip',detail:'Not checked.'},
      {label:'First entry at this checkpoint',state:'skip',detail:'Not checked.'}];
    res.qr='Unrecognised';return finish(res);
  }
  const p=DB.permit(id);
  if(!p){
    res.reason='Permit ID not found';
    res.checks=[
      {label:'Permit on record',state:'fail',detail:`No permit ${id||'(blank)'} exists in this browser's records.`},
      {label:'QR details match',state:'skip',detail:'Not checked.'},
      {label:'Within validity dates',state:'skip',detail:'Not checked.'},
      {label:'First entry at this checkpoint',state:'skip',detail:'Not checked.'}];
    res.qr=payload?'Unmatched':'Not used';return finish(res);
  }
  res.permit=p;
  const fails=[];
  res.checks.push({label:'Permit on record',state:'pass',detail:`${p.id} issued to ${p.name}.`});
  if(payload){
    const same=String(payload.name||'').trim().toLowerCase()===p.name.trim().toLowerCase()&&String(payload.dest||'').trim().toLowerCase()===p.dest.trim().toLowerCase();
    if(same){res.checks.push({label:'QR details match',state:'pass',detail:'Name and destination in the QR agree with the record.'});res.qr='Matched'}
    else{
      const bits=[];
      if(String(payload.name||'').trim().toLowerCase()!==p.name.trim().toLowerCase())bits.push(`name "${payload.name??'–'}" vs "${p.name}"`);
      if(String(payload.dest||'').trim().toLowerCase()!==p.dest.trim().toLowerCase())bits.push(`destination "${payload.dest??'–'}" vs "${p.dest}"`);
      res.checks.push({label:'QR details match',state:'fail',detail:'Mismatch: '+bits.join('; ')+'.'});
      fails.push('QR details do not match the permit record');res.qr='Mismatch';
    }
  }else res.checks.push({label:'QR details match',state:'skip',detail:'Permit ID entered by hand, so there is no QR data to compare.'});
  const t=today();
  if(t<p.from){res.checks.push({label:'Within validity dates',state:'fail',detail:`Valid from ${fmtDate(p.from)}. Today is ${fmtDate(t)}.`});fails.push(`Permit not valid until ${fmtDate(p.from)}`)}
  else if(t>p.to){res.checks.push({label:'Within validity dates',state:'fail',detail:`Expired on ${fmtDate(p.to)}.`});fails.push(`Permit expired on ${fmtDate(p.to)}`)}
  else res.checks.push({label:'Within validity dates',state:'pass',detail:`${fmtDate(p.from)} to ${fmtDate(p.to)}.`});
  const dup=DB.entries().find(e=>e.permitId===p.id&&e.checkpoint===checkpoint);
  if(dup){res.checks.push({label:'First entry at this checkpoint',state:'fail',detail:`Already recorded here on ${fmtTime(dup.ts)}.`});fails.push('Duplicate entry at this checkpoint')}
  else res.checks.push({label:'First entry at this checkpoint',state:'pass',detail:'No earlier entry for this permit here. Other checkpoints do not count.'});
  if(fails.length)res.reason=fails[0];
  return finish(res,fails);
}
function finish(res,fails){
  res.ok=!res.reason;
  const base={permitId:res.id,checkpoint:res.checkpoint,method:res.method,ts:Date.now()};
  if(res.ok)DB.addEntry({...base,id:'e'+base.ts,name:res.permit.name,dest:res.permit.dest});
  else DB.addFlag({...base,id:'f'+base.ts,reason:res.reason+(fails&&fails.length>1?` (+${fails.length-1} more)`:'')});
  return res;
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const h=$('#toastHost');h.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastT);toastT=setTimeout(()=>h.innerHTML='',2800);
}
async function copy(text,label){
  try{await navigator.clipboard.writeText(text);toast(label+' copied')}
  catch(e){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}
    ta.remove();toast(ok?label+' copied':'Copy is blocked here. Select the text and copy it by hand.');
  }
}

}
function drawQRs(root=document){
  $$('.qrbox[data-payload]',root).forEach(b=>{
    b.innerHTML='';
    try{new QRCode(b,{text:b.dataset.payload,width:190,height:190,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}
    catch(e){b.innerHTML='<small style="color:#000;line-height:1.3;display:block;padding:8px">QR library did not load. Reload the page.</small>'}
  });
}

        :`<div class="muted">No permit details available. A flagged case was saved with the submitted value.</div>`}
      </div></section>`:'';
  $('#sessionLog').innerHTML=officer.session.length?`<div class="card"><h3>This session</h3><div class="tw" style="margin-top:10px"><table><thead><tr><th>Time</th><th>Permit</th><th>Checkpoint</th><th>Result</th></tr></thead><tbody>${officer.session.slice(0,8).map(s=>`<tr><td class="mono">${fmtTime(s.ts)}</td><td class="mono">${esc(s.id)}</td><td>${esc(s.cp)}</td><td><span class="pill ${s.ok?'ok':'bad'}">${s.ok?'Cleared':'Flagged'}</span> <span class="muted">${s.ok?'':esc(s.reason)}</span></td></tr>`).join('')}</tbody></table></div></div>`:'';
}
function officerVerify(raw,method){
  const r=verify(raw,method,officer.checkpoint);
  officer.result=r;
  officer.session.unshift({ts:Date.now(),id:r.id||'(blank)',cp:r.checkpoint,ok:r.ok,reason:r.reason});
  renderOfficerResult();
  $('#result').scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function stopScanner(){
  const s=officer.scanner;officer.scanner=null;
  if(s){try{await s.stop()}catch(e){}try{s.clear()}catch(e){}}
}
function hookOfficer(){
  renderOfficerResult();
  $('#cp').onchange=e=>{officer.checkpoint=e.target.value};
  $('#manualForm').onsubmit=e=>{
    e.preventDefault();const v=$('#manualId').value;
    if(!v.trim()){$('#scanMsg').textContent='Enter a permit ID first.';return}
    officerVerify(v,'Manual');
  };
  $('#presentForm').onsubmit=e=>{
    e.preventDefault();const p=DB.permit($('#presentSel').value);if(!p)return;
    let over=null;
    if($('#tamper').checked){const other=DESTINATIONS.find(d=>d!==p.dest);over={dest:other}}
    officerVerify(qrPayload(p,over),'QR');
  };
  $('#qrFile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const msg=$('#scanMsg');msg.textContent='Reading QR image…';
    try{
      await stopScanner();
      const s=new Html5Qrcode('reader');
      const text=await s.scanFile(f,false);
      try{s.clear()}catch(_){}
      msg.textContent='QR read from image.';officerVerify(text,'QR');
    }catch(err){msg.textContent='No QR code could be read from that image. Try a clearer screenshot or enter the ID.'}
    e.target.value='';
  };
  $('#camBtn').onclick=async()=>{
    const msg=$('#scanMsg'),btn=$('#camBtn');
    if(officer.scanner){await stopScanner();btn.textContent='Start camera scanner';msg.textContent='';return}
    try{
      const s=new Html5Qrcode('reader');officer.scanner=s;
      await s.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async text=>{
        await stopScanner();btn.textContent='Start camera scanner';officerVerify(text,'QR');
      },()=>{});
      btn.textContent='Stop camera';msg.textContent='Scanning. Hold the QR steady inside the frame.';
    }catch(err){
      officer.scanner=null;
      msg.textContent='The camera is not available in this view. Upload a QR image, present a stored permit, or enter the ID instead.';
    }
  };
}

/* ---------- router ---------- */
let current=null;
const ROUTES=['home','apply','permits','officer','admin','about'];
function show(r,force){
  r=r||'home';
  if(r===current&&!force)return;
  current=r;
  stopScanner();
  const v=$('#view');
  const isPermit=/^TN-\d{4}-\d{5}$/.test(r);
  if(isPermit)v.innerHTML=pages.permit(r);
  else if(ROUTES.includes(r))v.innerHTML=pages[r]();
  else{r='home';current='home';v.innerHTML=pages.home()}
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.go===r||(isPermit&&a.dataset.go==='permits')));
  drawQRs(v);
  if(r==='apply')hookApply();
  if(r==='officer')hookOfficer();
  if(r==='admin')adminTable();
  window.scrollTo(0,0);
}
function go(r){
  try{if(location.hash.slice(1)!==r)location.hash=r}catch(e){}
  show(r);
}
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]');
  if(a){e.preventDefault();go(a.dataset.go);return}
  const c=e.target.closest('[data-copy]');
  if(c){copy(c.dataset.copy,c.dataset.label);return}
  const act=e.target.closest('[data-act]');
  if(act){
    const k=act.dataset.act;
    if(k==='clearSample'){DB.clear(true);toast('Sample data cleared');show('admin',true)}
    if(k==='clearAll'){
      if(confirmKey===k){clearTimeout(confirmT);confirmKey='';DB.clear(false);toast('All records deleted');show('admin',true)}
      else{confirmKey=k;act.textContent='Click again to confirm';clearTimeout(confirmT);confirmT=setTimeout(()=>{confirmKey='';act.textContent='Delete all records'},4000)}
    }
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='adminQ'){adminQ=e.target.value;adminTable()}
});

/* apply form */
function hookApply(){
  const f=$('#applyForm');
  f.addEventListener('submit',e=>{
    e.preventDefault();
    const g=n=>f.elements[n].value.trim();
    const v={name:g('name'),phone:g('phone'),gid:g('gid'),vehicle:g('vehicle').toUpperCase().replace(/\s+/g,' '),dest:g('dest'),purpose:g('purpose'),from:g('from'),to:g('to')};
    const er={};
    if(v.name.length<3||!/^[A-Za-z .'-]+$/.test(v.name))er.name='Enter the full name using letters only.';
    if(!/^[6-9]\d{9}$/.test(v.phone))er.phone='Enter a 10-digit mobile number starting with 6, 7, 8 or 9.';
    if(!/^[A-Za-z0-9-]{6,20}$/.test(v.gid))er.gid='Enter 6 to 20 letters or digits.';
    if(!/^[A-Z]{2}\s?\d{1,2}\s?[A-Z]{1,3}\s?\d{4}$/.test(v.vehicle))er.vehicle='Use the format TN 01 AB 1234.';
    if(!v.dest)er.dest='Select a destination.';
    if(!v.purpose)er.purpose='Select a purpose.';
    if(!v.from)er.from='Choose a start date.';
    if(!v.to)er.to='Choose an end date.';
    else if(v.from&&v.to<v.from)er.to='The end date must be on or after the start date.';
    else if(v.to<today())er.to='The end date cannot be in the past.';
    $$('.err',f).forEach(x=>x.textContent=er[x.dataset.e]||'');
    ['name','phone','gid','vehicle','dest','purpose','from','to'].forEach(n=>f.elements[n].classList.toggle('bad',!!er[n]));
    const first=Object.keys(er)[0];
    if(first){f.elements[first].focus();return}
    const hasSelfie=f.elements.selfie.files&&f.elements.selfie.files.length>0;
    const p={id:newId(),...v,idStatus:hasSelfie?'Selfie attached (demo)':'ID number on record (demo)',createdAt:Date.now()};
    DB.savePermit(p);
    toast('Permit '+p.id+' issued');
    go(p.id);
  });
}
